<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Office Health League — Workplace fitness league with effort-based scoring">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="160" cy="40" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1180" cy="360" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="motif" x1="850" y1="60" x2="1220" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glowA)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect width="1280" height="360" fill="url(#glowB)"/>

    <!-- MOTIF: heartbeat trace over a leaderboard podium -->
    <g id="motif-group" fill="none" stroke="url(#motif)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M850 140 H960 l14 -40 l18 80 l16 -110 l16 90 l12 -20 H1100 l10 -18 l10 18 H1205"/>
      <circle cx="1205" cy="140" r="5" fill="#10B981" stroke="none">
        <animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <rect x="935" y="235" width="70" height="65" rx="4" stroke-opacity="0.7"/>
      <rect x="1005" y="205" width="70" height="95" rx="4"/>
      <rect x="1075" y="255" width="70" height="45" rx="4" stroke-opacity="0.5"/>
      <path d="M915 300 H1165" stroke-opacity="0.45"/>
      <path d="M1040 176 l4.5 9 10 1.5 -7.2 7 1.7 9.9 -9 -4.7 -9 4.7 1.7 -9.9 -7.2 -7 10 -1.5 Z" fill="#FF6B35" fill-opacity="0.85" stroke="none"/>
    </g>
  </g>

  <text x="80" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="url(#title)">Office Health League</text>
  <text x="84" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#cbd5e1">Workplace fitness league · effort-based scoring</text>

  <!-- CHIPS: width = chars*10.85 + 32; 14px gap between chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#e2e8f0">
    <g transform="translate(84 256)">
      <rect width="140.5" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">Next.js 14</text>
    </g>
    <g transform="translate(238.5 256)">
      <rect width="118.8" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">Supabase</text>
    </g>
    <g transform="translate(371.3 256)">
      <rect width="173.05" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">Capacitor iOS</text>
    </g>
    <g transform="translate(558.35 256)">
      <rect width="129.65" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">HealthKit</text>
    </g>
    <g transform="translate(702 256)">
      <rect width="86.25" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="16" y="25">Slack</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="359" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
